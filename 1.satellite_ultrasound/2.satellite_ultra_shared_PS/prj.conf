CONFIG_UART_ASYNC_API=y
# CONFIG_LOG_PRINTK=n

# To print LOG messages immediately
CONFIG_LOG_BACKEND_UART_ASYNC=n      # Force sync UART for logs
CONFIG_LOG_MODE_IMMEDIATE=y          # Process logs immediately (for debugging)
